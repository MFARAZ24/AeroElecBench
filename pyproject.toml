[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroecad-agent"
version = "0.2.0"
description = "Traceable validation prototype for synthetic aerospace electrical-design data"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aeroecad = "aeroecad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
